    <path d="M 6 188 L 6 212 C 6 218.63 11.37 224 18 224 L 42 224" stroke="#A78BFA" stroke-width="2.5" fill="none"/>
    <path d="M 798 224 L 822 224 C 828.63 224 834 218.63 834 212 L 834 188" stroke="#A78BFA" stroke-width="2.5" fill="none"/>

    <circle cx="36" cy="30" r="3.5" fill="#10B981"/>
