<div align="center">
  <svg width="840" height="230" viewBox="0 0 840 230" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="plasma" cx="50%" cy="35%" r="65%">
        <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.55"/>
        <stop offset="50%" stop-color="#1E1035" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#05020B" stop-opacity="0.98"/>
      </radialGradient>

      <linearGradient id="cyber-text" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00F0FF"/>
        <stop offset="40%" stop-color="#C084FC"/>
        <stop offset="80%" stop-color="#F43F5E"/>
        <stop offset="100%" stop-color="#A855F7"/>
      </linearGradient>

      <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
        <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
      </linearGradient>

      <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="0.8" fill="#A855F7" fill-opacity="0.18"/>
      </pattern>

      <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <rect x="6" y="6" width="828" height="218" rx="12" fill="#06020D" stroke="url(#neon-stroke)" stroke-width="1.6"/>
    <rect x="6" y="6" width="828" height="218" rx="12" fill="url(#plasma)"/>
    <rect x="6" y="6" width="828" height="218" rx="12" fill="url(#grid)"/>

    <path d="M 6 42 L 6 18 C 6 11.37 11.37 6 18 6 L 42 6" stroke="#00F0FF" stroke-width="2.5" fill="none"/>
