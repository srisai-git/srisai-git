    <text x="804" y="34" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10" font-weight="600" text-anchor="end" letter-spacing="1.5">LAT: 13.08°N • LON: 80.27°E</text>

    <line x1="30" y1="46" x2="810" y2="46" stroke="#26123D" stroke-width="1"/>

    <text x="420" y="112" fill="url(#cyber-text)" font-family="'Space Grotesk', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="5" text-anchor="middle" filter="url(#bloom)">P. SRISAI</text>

    <text x="420" y="142" fill="#00F0FF" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11.5" font-weight="700" letter-spacing="4" text-anchor="middle">ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>

    <rect x="360" y="156" width="120" height="1" fill="#7C3AED" opacity="0.6"/>

