    <text x="420" y="206" fill="#818CF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5" font-weight="600" letter-spacing="2.5" text-anchor="middle">KOTLIN • PYTHON • FASTAPI • JETPACK COMPOSE</text>
